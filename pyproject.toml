[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "metricway-sdk"
version = "0.1.0"
description = "Async metrics collector SDK for Telegram bots"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexander Tunik" }]
keywords = ["telegram", "aiogram", "analytics", "metrics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["aiohttp>=3.8,<4"]

[project.optional-dependencies]
aiogram = ["aiogram>=3.0,<4"]
dev = ["build>=1.2", "pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6", "twine>=5"]

[project.urls]
Homepage = "https://metricway.tech"
Source = "https://github.com/urlifeceo/metricway-sdk"
Issues = "https://github.com/urlifeceo/metricway-sdk/issues"

[tool.setuptools.packages.find]
include = ["metricway*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["metricway"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
