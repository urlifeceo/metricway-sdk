[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tgmetrics-sdk"
version = "0.1.0"
description = "Async metrics collector SDK for Telegram Bots"
authors = [{ name = "Alexander Tunik" }]
dependencies = [
    "aiohttp>=3.8.0",
]
requires-python = ">=3.9"

[project.optional-dependencies]
aiogram = [
    "aiogram>=3.0.0"
]